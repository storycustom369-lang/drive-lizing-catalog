<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог Драйв Лизинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#1B435C;
  --navy-soft:#4B5568;
  --blue:#2F6FED;
  --blue-dark:#2557C7;
  --surface:#FFFFFF;
  --surface-page:#F4F6F9;
  --surface-tint:#F7F9FC;
  --border:#E9EDF4;
  --border-strong:#D7DEE8;
  --muted:#8A93A6;
  --shadow:0 10px 30px rgba(15,30,59,0.08);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--surface-page);color:var(--navy);font-family:'Golos Text',Arial,sans-serif;}
h1,h2,h3,.dl-num,.dl-btn,.dl-pill,.dl-title{font-family:'Onest',Arial,sans-serif;}
.dl-wrap{max-width:1180px;margin:0 auto;padding:0 24px 64px;}
.dl-sticky{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);}
.dl-tabs{display:flex;align-items:center;gap:10px;padding:14px 24px;max-width:1180px;margin:0 auto;overflow-x:auto;scrollbar-width:none;}
.dl-tabs::-webkit-scrollbar{display:none;}
.dl-pill{flex:none;padding:11px 20px;border-radius:999px;border:1px solid var(--border-strong);background:transparent;color:var(--navy);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;}
.dl-pill.is-active{background:var(--blue);border-color:var(--blue);color:#fff;}
.dl-source-pill{background:var(--surface-tint);}
.dl-tabs__pinned{position:sticky;left:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--surface);padding-right:4px;}
.dl-pill--range{display:flex;flex-direction:column;align-items:center;gap:0;padding-top:7px;padding-bottom:7px;line-height:1.1;}
.dl-pill__main{font-size:14px;font-weight:700;}
.dl-pill__sub{font-size:9px;font-weight:600;opacity:.7;margin-top:1px;}
.dl-tabs__divider{flex:none;width:1px;align-self:stretch;background:var(--border-strong);margin:2px 2px;}
@media (max-width:640px){
  .dl-source-pill{font-size:12.5px;padding:10px 14px;}
  .dl-pill--range{padding-top:6px;padding-bottom:6px;padding-left:14px;padding-right:14px;}
  .dl-pill__main{font-size:12.5px;}
  .dl-pill__sub{font-size:8px;}
}
.dl-marquee{overflow:hidden;background:var(--blue);white-space:nowrap;}
.dl-marquee__track{display:inline-flex;align-items:center;animation:dlscroll 26s linear infinite;}
.dl-marquee__item{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:#fff;padding:10px 20px;white-space:nowrap;}
.dl-marquee__item svg{filter:brightness(0) invert(1);}
.dl-marquee__dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.5);flex:none;}
@keyframes dlscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.dl-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 18px;flex-wrap:wrap;}
.dl-heading h2{font-size:20px;font-weight:600;margin:0;color:var(--navy);}
.dl-count{font-size:13px;color:var(--muted);font-weight:600;}
.dl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
.dl-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
.dl-card__art{aspect-ratio:16/10;background:var(--surface-tint);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.dl-card__art svg{width:56px;height:56px;color:var(--border-strong);}
.dl-card__art img{width:100%;height:100%;object-fit:cover;display:block;}
.dl-gallery{position:relative;width:100%;height:100%;}
.dl-gallery__track{display:flex;width:100%;height:100%;transition:transform .25s ease;}
.dl-gallery__slide{flex:none;width:100%;height:100%;}
.dl-gallery__slide img{width:100%;height:100%;object-fit:cover;display:block;}
.dl-gallery__nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(15,30,59,.45);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s,background .15s;z-index:2;}
.dl-gallery__nav:hover{background:rgba(15,30,59,.7);}
.dl-gallery__nav.is-prev{left:8px;}
.dl-gallery__nav.is-next{right:8px;}
.dl-gallery:hover .dl-gallery__nav{opacity:1;}
.dl-gallery__nav svg{width:14px;height:14px;}
.dl-gallery__dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2;}
.dl-gallery__dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);border:none;padding:0;cursor:pointer;transition:background .15s,width .15s;}
.dl-gallery__dot.is-active{background:#fff;width:14px;border-radius:3px;}
.dl-gallery__count{position:absolute;top:10px;right:10px;background:rgba(15,30,59,.55);color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:999px;z-index:2;}
.dl-modal__photo .dl-gallery__nav{width:34px;height:34px;opacity:1;}
.dl-modal__photo .dl-gallery__nav svg{width:16px;height:16px;}
.dl-card__badge{position:absolute;top:10px;left:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--muted);}
.dl-lease-badge{position:absolute;bottom:10px;left:10px;z-index:2;display:inline-flex;align-items:center;gap:4px;background:rgba(27,67,92,.85);color:#fff;border-radius:999px;padding:4px 10px 4px 8px;font-size:10.5px;font-weight:700;cursor:help;}
.dl-lease-badge svg{width:12px;height:12px;flex:none;}
.dl-issued-stamp{position:absolute;top:42%;left:6%;z-index:3;transform:rotate(-12deg);border:3px solid #1F9D4C;border-radius:8px;background:rgba(255,255,255,.9);color:#1F9D4C;font-family:'Onest',Arial,sans-serif;font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;padding:5px 14px;pointer-events:none;white-space:nowrap;}
@media (max-width:640px){
  .dl-issued-stamp{font-size:12px;padding:3px 10px;border-width:2px;top:40%;left:5%;}
}
.dl-lease-note{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb, var(--blue) 8%, var(--surface-tint));border:1px solid var(--border-strong);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--navy-soft);line-height:1.5;margin-bottom:14px;}
.dl-lease-note svg{width:16px;height:16px;flex:none;color:var(--blue);margin-top:1px;}
.dl-selling{font-size:13.5px;color:var(--navy);font-weight:600;line-height:1.5;margin-bottom:16px;}
.dl-gift-badge{text-align:center;font-size:13px;font-weight:700;color:var(--navy);background:color-mix(in srgb, var(--blue) 10%, var(--surface-tint));border-radius:10px;padding:9px 12px;margin-top:10px;}
.dl-card__body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1;}
.dl-title{font-size:17px;font-weight:600;color:var(--navy);line-height:1.25;}
.dl-spec{font-size:12.5px;color:var(--navy-soft);line-height:1.5;}
.dl-komplekt{font-size:12px;color:var(--muted);line-height:1.5;flex:1;}
.dl-price-row{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
.dl-unavail-note{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.4;}
.dl-price-week{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;}
.dl-price-label{font-size:11px;color:var(--muted);font-weight:600;}
.dl-num{font-size:19px;font-weight:700;color:var(--blue);}
.dl-btn{width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s;}
.dl-btn:hover{background:var(--blue-dark);}
.dl-btn--disabled,.dl-btn--disabled:hover{background:transparent;color:#D14343;cursor:not-allowed;text-decoration:line-through;border:1.5px solid #D14343;}
.dl-empty{padding:60px 0;text-align:center;color:var(--muted);font-size:14px;}
.dl-modal-backdrop{position:fixed;inset:0;background:rgba(15,30,59,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.dl-modal-backdrop[hidden]{display:none;}
.dl-modal{background:var(--surface);border-radius:20px;max-width:420px;width:100%;padding:24px;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto;position:relative;}
.dl-modal__head{position:sticky;top:-24px;margin:-24px -24px 16px;padding:16px 24px 12px;background:var(--surface);z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);}
.dl-modal__title{font-size:16px;font-weight:600;color:var(--navy);}
.dl-modal__close{background:var(--surface-tint);border:none;color:var(--navy);cursor:pointer;font-size:20px;line-height:1;padding:6px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
.dl-modal__scrollcue{position:sticky;bottom:0;left:0;right:0;height:28px;margin:0 -24px -24px;background:linear-gradient(to bottom, rgba(255,255,255,0), var(--surface) 85%);pointer-events:none;display:flex;align-items:flex-end;justify-content:center;z-index:1;}
.dl-modal__scrollcue svg{width:18px;height:18px;color:var(--muted);margin-bottom:4px;animation:dlbounce 1.6s ease-in-out infinite;}
.dl-modal__scrollcue.is-hidden{display:none;}
@keyframes dlbounce{0%,100%{transform:translateY(0);opacity:.55;}50%{transform:translateY(4px);opacity:1;}}
@media (max-width:640px){
  .dl-modal-backdrop{padding:0;}
  .dl-modal{max-width:100%;width:100%;height:100dvh;max-height:100dvh;border-radius:0;}
  .dl-modal__photo{aspect-ratio:16/11;margin-bottom:12px;}
}
.dl-field{margin-bottom:14px;}
.dl-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;}
.dl-seg{display:grid;gap:6px;background:var(--surface-tint);border-radius:999px;padding:4px;}
.dl-seg button{border:none;background:transparent;color:var(--navy-soft);font-weight:700;font-size:13px;padding:9px 6px;border-radius:999px;cursor:pointer;font-family:'Onest',Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dl-seg button.is-active{background:var(--blue);color:#fff;}
.dl-pv-sum{font-size:12px;color:var(--muted);margin-top:8px;font-weight:600;}
.dl-result{border-top:1px solid var(--border);padding-top:14px;margin-top:4px;display:flex;gap:6px;}
.dl-result__cell{flex:1;min-width:0;background:var(--surface-tint);border-radius:12px;padding:8px 4px;text-align:center;}
.dl-result__cell.is-main{background:color-mix(in srgb, var(--blue) 12%, var(--surface-tint));}
.dl-result__num{font-size:14px;font-weight:700;display:block;color:var(--navy);white-space:nowrap;}
.dl-result__unit{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;}
@media (max-width:640px){
  .dl-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
}

.dl-topbar{position:sticky;top:0;z-index:41;background:var(--surface);border-bottom:1px solid var(--border);}
.dl-topbar__inner{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:nowrap;}
.dl-topbar__logo{display:flex;flex-direction:row;align-items:center;gap:14px;}
.dl-topbar__logo-text{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
.dl-topbar__logo-img{height:64px;width:auto;flex:none;display:block;}
.dl-topbar__slogan{font-family:'Onest',Arial,sans-serif;font-size:14px;font-weight:700;line-height:1.3;color:var(--navy);text-transform:uppercase;max-width:320px;}
.dl-topbar__slogan em{font-style:normal;color:var(--blue);white-space:nowrap;}
.dl-topbar__caption{font-family:'Onest',Arial,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.01em;color:var(--navy-soft);}
.dl-topbar__reviews{text-align:right;margin-left:auto;}
.dl-topbar__stars{display:flex;align-items:center;justify-content:flex-end;gap:4px;}
.dl-topbar__stars svg{width:12px;height:12px;flex:none;color:#F5A623;}
.dl-topbar__stars b{font-size:14px;font-weight:800;color:var(--navy);margin-left:2px;}
.dl-topbar__reviews-text{font-size:12px;font-weight:600;color:var(--navy-soft);margin-top:3px;max-width:260px;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:5px;}
.dl-topbar__review-logo{height:15px;width:auto;display:inline-block;vertical-align:middle;}
.dl-topbar__review-logo--avito{height:13px;}
@media (max-width:640px){
  .dl-topbar__inner{gap:10px;padding:12px 16px;}
  .dl-topbar__inner{gap:8px;}
  .dl-topbar__logo{gap:8px;}
  .dl-topbar__logo-img{height:38px;}
  .dl-topbar__slogan{font-size:9px;max-width:130px;}
  .dl-topbar__caption{font-size:8px;}
  .dl-topbar__reviews{text-align:right;}
  .dl-topbar__stars{justify-content:flex-end;}
  .dl-topbar__stars svg{width:10px;height:10px;}
  .dl-topbar__stars b{font-size:12px;}
  .dl-topbar__reviews-text{font-size:9.5px;max-width:130px;gap:3px;}
  .dl-topbar__review-logo{height:11px;}
  .dl-topbar__review-logo--avito{height:9px;}
}
.dl-marquee--top{background:var(--surface);border-bottom:1px solid var(--border);}
.dl-marquee--top .dl-marquee__item{color:var(--navy);}
.dl-marquee--top .dl-marquee__item svg{filter:none;}
.dl-marquee--top .dl-marquee__dot{background:var(--border-strong);}


.dl-ranges{background:var(--blue);padding:44px 24px;}
.dl-ranges--first{padding-top:40px;}
.dl-ranges__inner{max-width:1180px;margin:0 auto;}
.dl-ranges__head{text-align:center;max-width:560px;margin:0 auto 26px;}
.dl-ranges__head h2{font-size:32px;font-weight:800;color:#fff;margin:0 0 10px;text-wrap:balance;text-transform:uppercase;line-height:1.15;}
.dl-ranges__head h2 em{font-style:normal;color:var(--navy);background:#fff;padding:2px 10px;border-radius:8px;display:inline-block;}
.dl-ranges__head p{font-size:14px;color:rgba(255,255,255,.65);margin:0;}
.dl-range-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
@media (max-width:640px){
  .dl-range-grid{grid-template-columns:1fr;}
}
.dl-range-card{position:relative;display:flex;align-items:stretch;background:#fff;border:none;border-radius:16px;overflow:hidden;padding:0;cursor:pointer;text-align:left;font-family:inherit;transition:transform .15s;aspect-ratio:2.3/1;}
.dl-range-card--full{display:block;}
.dl-range-card--full img{width:100%;height:100%;object-fit:cover;display:block;}
.dl-range-card:hover{transform:translateY(-2px);}
.dl-range-card__photo{width:48%;flex:none;background:#fff;padding:6px;}
.dl-range-card__photo img{width:100%;height:100%;object-fit:contain;display:block;}
.dl-range-card__body{flex:1;min-width:0;padding:16px 20px;display:flex;flex-direction:column;justify-content:center;}
.dl-range-card__num{font-size:34px;font-weight:800;color:var(--navy);line-height:1;text-transform:uppercase;}
.dl-range-card__num small{font-size:17px;font-weight:800;color:var(--navy);margin-right:4px;}
.dl-range-card__label{font-size:13px;color:var(--muted);font-weight:700;margin-top:8px;letter-spacing:.02em;text-transform:uppercase;line-height:1.4;}
.dl-range-card__arrow{position:absolute;top:14px;right:14px;width:22px;height:22px;color:var(--navy);}
.dl-range-card__arrow svg{width:100%;height:100%;}


@media (max-width:860px){
  .dl-range-card__num{font-size:24px;}
  .dl-ranges__head h2{font-size:24px;}
}
.dl-modal__photo{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--surface-tint);margin-bottom:16px;}
.dl-gallery__track--zoomable{cursor:zoom-in;}
.dl-lightbox{position:fixed;inset:0;background:rgba(8,14,24,.94);z-index:200;display:flex;align-items:center;justify-content:center;}
.dl-lightbox[hidden]{display:none;}
.dl-lightbox__img{max-width:92vw;max-height:86vh;object-fit:contain;display:block;user-select:none;}
.dl-lightbox__close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.dl-lightbox__nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.dl-lightbox__nav svg{width:20px;height:20px;}
.dl-lightbox__nav.is-prev{left:16px;}
.dl-lightbox__nav.is-next{right:16px;}
.dl-lightbox__count{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:13px;font-weight:600;}
@media (max-width:640px){
  .dl-lightbox__nav{width:36px;height:36px;}
  .dl-lightbox__nav.is-prev{left:8px;}
  .dl-lightbox__nav.is-next{right:8px;}
  .dl-lightbox__close{width:34px;height:34px;top:10px;right:10px;font-size:22px;}
}
.dl-modal__photo img{width:100%;height:100%;object-fit:cover;display:block;}
.dl-modal__photo svg{width:48px;height:48px;color:var(--border-strong);}
.dl-modal__actions{display:flex;gap:10px;margin-top:16px;}
.dl-modal__actions .dl-btn{margin-top:0;}
.dl-btn-ghost{background:transparent;border:1px solid var(--border-strong);color:var(--navy);}
.dl-btn-ghost:hover{background:var(--surface-tint);}
.dl-form-field{margin-bottom:12px;}
.dl-form-input,.dl-form-textarea{width:100%;font-family:'Golos Text',Arial,sans-serif;font-size:14px;color:var(--navy);background:var(--surface-tint);border:1px solid var(--border-strong);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .15s;}
.dl-form-input:focus,.dl-form-textarea:focus{border-color:var(--blue);}
.dl-form-textarea{resize:vertical;min-height:64px;font-family:inherit;}
.dl-form-hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4;}
.dl-form-consent{display:flex;align-items:flex-start;gap:8px;margin:12px 0;font-size:12.5px;color:var(--navy-soft);line-height:1.4;cursor:pointer;}
.dl-form-consent input{flex:none;width:16px;height:16px;margin-top:1px;accent-color:var(--blue);cursor:pointer;}
.dl-form-consent a{color:var(--blue);}
.dl-form-consent.is-error{color:#D14343;}
.dl-success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:12px 4px 4px;}
.dl-success svg{width:44px;height:44px;color:var(--blue);}
.dl-success__title{font-size:16px;font-weight:700;color:var(--navy);}
.dl-success__text{font-size:13px;color:var(--navy-soft);line-height:1.5;}

.dl-cta{margin-top:48px;background:var(--blue);border-radius:20px;overflow:hidden;}
.dl-cta__inner{display:grid;grid-template-columns:1.1fr 1fr;gap:0;}
.dl-cta__left{padding:36px 34px;display:flex;flex-direction:column;justify-content:center;gap:12px;}
.dl-cta__frame{border:1.5px dashed rgba(255,255,255,.35);border-radius:16px;padding:18px 20px;background:rgba(255,255,255,.08);}
.dl-cta__title{font-family:'Onest',Arial,sans-serif;font-size:21px;font-weight:600;color:#fff;line-height:1.3;margin:0 0 8px;text-wrap:balance;}
.dl-cta__text{font-size:13.5px;color:rgba(255,255,255,.75);line-height:1.55;margin:0;}
.dl-cta__links{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center;}
.dl-cta__link{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:600;font-size:13px;text-decoration:none;transition:background .15s,color .15s;}
.dl-cta__link:hover{background:#fff;color:var(--blue);}
.dl-cta__right{padding:34px;background:var(--surface);display:flex;flex-direction:column;justify-content:center;}
.dl-cta__form-title{font-size:13px;font-weight:700;color:var(--navy);margin:0 0 14px;}
@media (max-width:760px){
  .dl-cta__inner{grid-template-columns:1fr;}
  .dl-cta__left{padding:28px 22px;}
  .dl-cta__right{padding:26px 22px;}
}
</style>

  function lightboxRender(){
    var img = lightbox.el.querySelector('.dl-lightbox__img');
    img.src = lightbox.photos[lightbox.idx];
    img.alt = lightbox.title;
    lightbox.el.querySelector('.dl-lightbox__count').textContent = (lightbox.idx + 1) + '/' + lightbox.photos.length;
    var navs = lightbox.el.querySelectorAll('.dl-lightbox__nav');
    navs.forEach(function(n){ n.hidden = lightbox.photos.length < 2; });
  }

  function lightboxGo(newIdx){
    lightbox.idx = (newIdx + lightbox.photos.length) % lightbox.photos.length;
    lightboxRender();
  }

  function closeLightbox(){
    if (!lightbox.el) return;
    lightbox.el.hidden = true;
    document.body.style.overflow = '';
  }

  function ensureLightboxEl(){
    if (lightbox.el) return lightbox.el;
    var el = document.createElement('div');
    el.className = 'dl-lightbox';
    el.hidden = true;
    el.innerHTML =
      '<button type="button" class="dl-lightbox__close" aria-label="Закрыть">&times;</button>' +
      '<button type="button" class="dl-lightbox__nav is-prev" aria-label="Предыдущее фото">' + NAV_PREV_SVG + '</button>' +
      '<img class="dl-lightbox__img" alt="">' +
      '<button type="button" class="dl-lightbox__nav is-next" aria-label="Следующее фото">' + NAV_NEXT_SVG + '</button>' +
      '<div class="dl-lightbox__count"></div>';
    document.body.appendChild(el);

    el.querySelector('.dl-lightbox__close').addEventListener('click', closeLightbox);
    el.addEventListener('click', function(e){ if (e.target === el) closeLightbox(); });
    el.querySelector('.dl-lightbox__nav.is-prev').addEventListener('click', function(e){ e.stopPropagation(); lightboxGo(lightbox.idx - 1); });
    el.querySelector('.dl-lightbox__nav.is-next').addEventListener('click', function(e){ e.stopPropagation(); lightboxGo(lightbox.idx + 1); });

    var tsx = null, tsy = null, tdx = 0, tlock = null;
    el.addEventListener('touchstart', function(e){
      var t = e.touches[0];
      tsx = t.clientX; tsy = t.clientY; tdx = 0; tlock = null;
    }, {passive:true});
    el.addEventListener('touchmove', function(e){
      if (tsx === null) return;
      var t = e.touches[0];
      var dx = t.clientX - tsx, dy = t.clientY - tsy;
      if (tlock === null) tlock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (tlock === 'x') { tdx = dx; if (e.cancelable) e.preventDefault(); }
    }, {passive:false});
    el.addEventListener('touchend', function(){
      if (tlock === 'x' && Math.abs(tdx) > 40) {
        lightboxGo(lightbox.idx + (tdx < 0 ? 1 : -1));
      } else if (tlock === null && tdx === 0) {
        // treated as a tap; let native click handle it
      }
      tsx = null; tdx = 0; tlock = null;
    });

    document.addEventListener('keydown', function(e){
      if (lightbox.el.hidden) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lightboxGo(lightbox.idx - 1);
      if (e.key === 'ArrowRight') lightboxGo(lightbox.idx + 1);
    });

    lightbox.el = el;
    return el;
  }

  }

  function sellingLine(car){
    var kuzov = (car.kuzov || 'автомобиль').toLowerCase();
    var isNew = car.spec && /^0\s*км/.test(car.spec);
    if (car.isLeaseProgram) {
      return 'Новый ' + kuzov + ' по программе лизинга с минимальным порогом входа и понятным ежемесячным платежом.';
    }
    if (isNew) {
      return 'Абсолютно новый ' + kuzov + ' без пробега, заводская гарантия и полная комплектация.';
    }
    return 'Забирайте проверенный ' + kuzov + ' уже сегодня, оформление за несколько часов.';
  }

  function isUsedCarGift(car){

  function cardDayAtMaxTerm(car){
    var variant = car.variants['20'] || car.variants[Object.keys(car.variants)[0]];
    if (!variant) return null;
    var termKeys = Object.keys(variant.terms).map(Number);
    var maxTerm = Math.max.apply(null, termKeys);
    var t = variant.terms[String(maxTerm)];
    if (!t) return null;
    return { day: t.day, week: t.week, term: maxTerm };
  }

    container.innerHTML = '';

    var nameField = document.createElement('div');
    nameField.className = 'dl-form-field';
    var nameInput = document.createElement('input');
    nameInput.className = 'dl-form-input';
    nameInput.type = 'text';
    nameInput.placeholder = 'Ваше имя';
    nameField.appendChild(nameInput);

    var phoneField = document.createElement('div');
    phoneField.className = 'dl-form-field';
    var phoneInput = document.createElement('input');
    phoneInput.className = 'dl-form-input';
    phoneInput.type = 'tel';
    phoneInput.inputMode = 'tel';
    phoneInput.placeholder = 'Телефон, например +7 995 052-76-83';
    phoneInput.addEventListener('input', function(){
      var digits = phoneInput.value.replace(/\D/g, '');
      if (!digits) { phoneInput.value = ''; return; }
      if (digits.charAt(0) === '8') digits = '7' + digits.slice(1);
      if (digits.charAt(0) !== '7') digits = '7' + digits;
      digits = digits.slice(0, 11);
      var out = '+7';
      if (digits.length > 1) out += ' ' + digits.slice(1, 4);
      if (digits.length >= 5) out += ' ' + digits.slice(4, 7);
      if (digits.length >= 8) out += '-' + digits.slice(7, 9);
      if (digits.length >= 10) out += '-' + digits.slice(9, 11);
      phoneInput.value = out;
    });
    phoneField.appendChild(phoneInput);

    var commentField = document.createElement('div');
    commentField.className = 'dl-form-field';
    var commentInput = document.createElement('textarea');
    commentInput.className = 'dl-form-textarea';
    commentInput.placeholder = opts.commentPlaceholder || 'Комментарий (необязательно)';
    commentField.appendChild(commentInput);

    var submitBtn = document.createElement('button');
    submitBtn.className = 'dl-btn';
    submitBtn.type = 'button';
    submitBtn.textContent = opts.submitLabel || 'Отправить';

    var errorMsg = document.createElement('div');
    errorMsg.className = 'dl-form-hint';
    errorMsg.style.color = '#D14343';
    errorMsg.hidden = true;

    var consentField = document.createElement('label');
    consentField.className = 'dl-form-consent';
    var consentInput = document.createElement('input');
    consentInput.type = 'checkbox';
    var consentText = document.createElement('span');
    consentText.innerHTML = 'Согласен на <a href="privacy.html" target="_blank" rel="noopener">обработку персональных данных</a>';
    consentField.appendChild(consentInput);
    consentField.appendChild(consentText);
    consentInput.addEventListener('change', function(){
      consentField.classList.remove('is-error');
    });

    container.appendChild(nameField);
    container.appendChild(phoneField);
    container.appendChild(commentField);
    container.appendChild(consentField);
    container.appendChild(errorMsg);
    container.appendChild(submitBtn);

    submitBtn.addEventListener('click', function(){
      var name = nameInput.value.trim();
      var phone = phoneInput.value.trim();
      if (!phone) {
        errorMsg.textContent = 'Укажите номер телефона, чтобы мы могли связаться с вами.';
        errorMsg.hidden = false;
        phoneInput.focus();
        return;
      }
      if (!consentInput.checked) {
        errorMsg.textContent = 'Нужно согласие на обработку персональных данных.';
        errorMsg.hidden = false;
        consentField.classList.add('is-error');
        return;
      }
      errorMsg.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправляем…';

      var record = Object.assign({
        name: name,
        phone: phone,
        comment: commentInput.value.trim(),
        createdAt: new Date().toISOString()
      }, opts.extra || {});

      dbPromise.then(function(db){
        if (db) return db.collection(opts.collection).add(record);
        if (!LEAD_WEBHOOK_URL || LEAD_WEBHOOK_URL.indexOf('REPLACE-ME') !== -1) {
          return Promise.reject(new Error('no_webhook'));
        }
        return fetch(LEAD_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(record)
        }).then(function(r){
          if (!r.ok) return Promise.reject(new Error('webhook_failed'));
        });
      }).then(function(){
        if (opts.onSuccess) opts.onSuccess();
      }).catch(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = opts.submitLabel || 'Отправить';
        errorMsg.textContent = 'Не получилось отправить. Попробуйте ещё раз или напишите нам в Telegram.';
        errorMsg.hidden = false;
      });
    });
  }

  function renderSuccess(container, title, text){
    container.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'dl-success';
    box.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<div class="dl-success__title">' + title + '</div>' +
      '<div class="dl-success__text">' + text + '</div>';
    container.appendChild(box);
  }

  function openBookingForm(car, getSelection){
    var modal = document.getElementById('dlModal');
    modal.innerHTML = '';

    var head = document.createElement('div');
    head.className = 'dl-modal__head';
    var titleWrap = document.createElement('div');
    var title = document.createElement('div');
    title.className = 'dl-modal__title';
    title.textContent = 'Бронирование: ' + carTitle(car);
    var sub = document.createElement('div');
    sub.style.cssText = 'font-size:12px;color:var(--muted);margin-top:4px;';
    sub.textContent = 'Артикул ' + car.art;
    titleWrap.appendChild(title);
    titleWrap.appendChild(sub);
    var closeBtn = document.createElement('button');
    closeBtn.className = 'dl-modal__close';
    closeBtn.setAttribute('aria-label', 'Закрыть');
    closeBtn.innerHTML = '&times;';
    closeBtn.addEventListener('click', closeModal);
    head.appendChild(titleWrap);
    head.appendChild(closeBtn);
    modal.appendChild(head);

    var formWrap = document.createElement('div');
    modal.appendChild(formWrap);

    var backLink = document.createElement('button');
    backLink.className = 'dl-btn dl-btn-ghost';
    backLink.type = 'button';
    backLink.style.marginTop = '10px';
    backLink.textContent = 'Назад к расчёту';
    backLink.addEventListener('click', function(){ openModal(car); });
    modal.appendChild(backLink);

    var sel = getSelection ? getSelection() : {};
    var variant = car.variants[sel.pv] || car.variants[Object.keys(car.variants)[0]];
    var term = sel.term || Object.keys(variant.terms)[0];
    var payment = variant.terms[term];

    buildLeadForm(formWrap, {
      collection: 'bookings',
      submitLabel: 'Забронировать автомобиль',
      commentPlaceholder: 'Удобное время для звонка, вопросы по авто (необязательно)',
      extra: {
        type: 'booking',
        carArt: car.art,
        carTitle: carTitle(car),
        pv: variant.label,
        term: term + ' мес',
        weekPayment: payment ? payment.week : null,
        monthPayment: payment ? payment.month : null,
        isLeaseProgram: !!car.isLeaseProgram
      },
      onSuccess: function(){
        renderSuccess(formWrap, 'Заявка принята',
          'Мы получили бронь на ' + carTitle(car) + '. Менеджер свяжется с вами в ближайшее время, чтобы подтвердить условия.');
        backLink.hidden = true;
      }
    });
  }

  function closeModal(){
    var backdropEl = document.getElementById('dlModalBackdrop');
    if (backdropEl) backdropEl.hidden = true;
    document.body.style.overflow = '';
  }
  if (document.getElementById('dlModalBackdrop')) {
    document.getElementById('dlModalBackdrop').addEventListener('click', function(e){
      if (e.target === this) closeModal();
    });
  }
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeModal();
  });

  function buildCtaForm(){
    var wrap = document.getElementById('dlCtaFormWrap');
    if (!wrap) return;
    buildLeadForm(wrap, {
      collection: 'requests',
      submitLabel: 'Отправить заявку',
      commentPlaceholder: 'Какая марка авто и год?\nЕсть ли ПВ?\nКакой платёж в месяц нужен?',
      extra: { type: 'custom_request' },
      onSuccess: function(){
        renderSuccess(wrap, 'Заявка отправлена', 'Спасибо! Мы подберём варианты и свяжемся с вами в ближайшее время.');
      }
    });
  }

  try {
    var urlParams = new URLSearchParams(window.location.search);
    var presetBucket = urlParams.get('b');
    if (presetBucket && BUCKETS.some(function(b){ return b.key === presetBucket; })) {
      state.bucket = presetBucket;
    }
  } catch (e) {}

  buildRangeCards();
  buildTabs();
  buildMarquee();
  renderGrid();
  buildCtaForm();

  function syncStickyOffset(){
    var topbar = document.querySelector('.dl-topbar');
    var sticky = document.querySelector('.dl-sticky');
    if (!topbar || !sticky) return;
    var h = topbar.getBoundingClientRect().height;
    sticky.style.top = h + 'px';
  }
  syncStickyOffset();
  window.addEventListener('resize', syncStickyOffset);
})();
</script>
